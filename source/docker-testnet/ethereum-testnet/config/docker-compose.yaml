services:
  # 1. Generate Artifacts (Genesis JSON, Keys, Configs)
  genesis:
    build:
      context: ./genesis
    volumes:
      - testnet-data:/shared
    environment:
      # Network ID
      - CHAIN_ID=32382
      - EL_NETWORK_ID=32382
      - CL_NETWORK_ID=32382
      
      # Merge Config
      - TERMINAL_TOTAL_DIFFICULTY=0
      
      # Consensus Config (All forks active at epoch 0)
      - ALTAIR_FORK_EPOCH=0
      - BELLATRIX_FORK_EPOCH=0
      - CAPELLA_FORK_EPOCH=0
      - DENEB_FORK_EPOCH=0
      - ELECTRA_FORK_EPOCH=100000000
      - FULU_FORK_EPOCH=100000000
      
      # Genesis Config
      - MIN_GENESIS_ACTIVE_VALIDATOR_COUNT=8
      - GENESIS_FORK_VERSION=0x00000001
      - NUMBER_OF_VALIDATORS=8
      - EL_AND_CL_MNEMONIC=giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete
    entrypoint: ["/bin/bash", "/generate.sh"]

  # 2. Initialize Geth Datadir (Uses official Geth image)
  geth-init:
    image: ethereum/client-go:v1.13.14
    depends_on:
      genesis:
        condition: service_completed_successfully
    volumes:
      - testnet-data:/data
    command: init --datadir=/data/geth /data/geth/genesis.json

  # 3. Import Validator Keys (Uses official Lighthouse image)
  validator-import:
    image: sigp/lighthouse:v5.1.0
    depends_on:
      genesis:
        condition: service_completed_successfully
    volumes:
      - testnet-data:/data
    entrypoint: ["/bin/sh", "/data/import_keys.sh"]

  # 4. Main Execution Client
  geth:
    image: ethereum/client-go:v1.13.14
    container_name: eth-execution
    restart: unless-stopped
    depends_on:
      geth-init:
        condition: service_completed_successfully
    command:
      - --datadir=/data/geth
      - --networkid=32382
      - --http
      - --http.api=eth,net,web3,debug,engine,txpool
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.vhosts=*
      - --http.corsdomain=*
      - --ws
      - --ws.api=eth,net,web3,debug,engine
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/data/jwtsecret
      - --nodiscover
      - --syncmode=full
      - --gcmode=archive
      - --maxpeers=0
    volumes:
      - testnet-data:/data
    ports:
      - "8545:8545"
      - "8546:8546"
      - "8551:8551"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # 5. Main Beacon Node
  beacon:
    image: sigp/lighthouse:v5.1.0
    container_name: eth-beacon
    restart: unless-stopped
    depends_on:
      geth:
        condition: service_healthy
    command:
      - lighthouse
      - beacon_node
      - --debug-level=info
      - --datadir=/data/beacon-data
      - --testnet-dir=/data/beacon-config
      - --execution-endpoint=http://geth:8551
      - --execution-jwt=/data/jwtsecret
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --http-allow-origin=*
      - --suggested-fee-recipient=0x0000000000000000000000000000000000000000
      - --execution-timeout-multiplier=5
      - --disable-deposit-contract-sync
      - --allow-insecure-genesis-sync
      - --disable-peer-scoring
      - --target-peers=0
    volumes:
      - testnet-data:/data
    ports:
      - "5052:5052"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5052/eth/v1/node/version"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # 6. Main Validator Client
  validator:
    image: sigp/lighthouse:v5.1.0
    container_name: eth-validator
    restart: unless-stopped
    depends_on:
      beacon:
        condition: service_healthy
      validator-import:
        condition: service_completed_successfully
    command:
      - lighthouse
      - validator_client
      - --debug-level=info
      - --testnet-dir=/data/beacon-config
      - --beacon-nodes=http://beacon:5052
      - --datadir=/data
      - --init-slashing-protection
      - --suggested-fee-recipient=0x0000000000000000000000000000000000000000
      - --graffiti=localnet
    volumes:
      - testnet-data:/data

volumes:
  testnet-data:
