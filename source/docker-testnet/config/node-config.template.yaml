# SCOUT(#239) REMOVE: whole file; only docker-compose-inline-genesis.yaml and validator-entrypoint.sh read it.
base:
  role: "validator"
  data_dir: "/opt/aptos/var/data"
  waypoint:
    from_file: "/opt/aptos/var/genesis/waypoint.txt"

execution:
  genesis_file_location: "/opt/aptos/var/genesis/genesis.blob"
  blockstm_v2_enabled: true

consensus:
  safety_rules:
    service:
      type: "local"
    backend:
      type: "on_disk_storage"
      path: "/opt/aptos/var/data/safety-rules.bin"
    initial_safety_rules_config:
      from_file:
        identity_blob_path: "/opt/aptos/var/identity/validator-identity.yaml"
        waypoint:
          from_file: "/opt/aptos/var/genesis/waypoint.txt"

validator_network:
  discovery_method: "onchain"
  listen_address: "/ip4/0.0.0.0/tcp/6180"
  mutual_authentication: true
  identity:
    type: "from_file"
    path: "/opt/aptos/var/identity/validator-identity.yaml"

full_node_networks: []

api:
  enabled: true
  address: "0.0.0.0:8080"

storage:
  rocksdb_configs:
    enable_storage_sharding: false
  # Matches atomica-aptos atomica/docker/tests/generate-genesis.sh (aptos-node 1.49.6).
  hot_state_config:
    max_items_per_shard: 250000
    refresh_interval_versions: 100000
    delete_on_restart: true
    compute_root_hash: true

# aptos-node 1.49.6 serves account resource listing (and event/tx lookups)
# only from the internal indexer DB, as the aptos localnet does
# (crates/aptos/src/node/local_testnet/node.rs). Without it the API returns
# "Indexer reader doesn't exist".
indexer_db_config:
  enable_transaction: true
  enable_event: true
  enable_statekeys: true
