name: EVM Contracts CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, debug-e2e]
  pull_request:
    branches: [main, master, debug-e2e]
    types: [opened, synchronize]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      ethereum-testnet:
        image: ethereum/client-go:latest
        ports:
          - 8545:8545
    defaults:
      run:
        working-directory: source/evm-contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build Ethereum Docker Testnet SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install && bun run build

      - name: Debug: Check SDK dist folder
        run: ls -la ../../docker-testnet/ethereum-testnet/typescript-sdk/dist/

      - name: Run e2e tests
        run: bun run test:docker
        env:
          ETH_RPC_URL: http://localhost:8545
