name: EVM Contracts CI

# Two tiers run the same orchestration suite. Only ETH_BACKEND differs.
# - anvil: fast JSON-RPC chain. Runs on draft PRs (feature-correctness).
# - docker: full Geth + Lighthouse PoS chain. Runs from ready-for-review
#   onward and on main (system-correctness).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**.txt"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "**.txt"]

jobs:
  e2e-tests-anvil:
    name: EVM e2e tests (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: feature-correctness
      ETH_BACKEND: anvil
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Forge dependencies
        working-directory: source/evm-contracts
        run: forge install

      - name: Install test-orchestration dependencies
        working-directory: source/evm-contracts
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install && bun run build

      - name: Run e2e tests
        working-directory: source/evm-contracts
        run: bun run test:docker
        env:
          ETH_RPC_URL: http://localhost:8545

  e2e-tests-docker:
    name: EVM e2e tests (docker)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_CLASS: system-correctness
      ETH_BACKEND: docker
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Forge dependencies
        working-directory: source/evm-contracts
        run: forge install

      - name: Install test-orchestration dependencies
        working-directory: source/evm-contracts
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install && bun run build

      - name: Run e2e tests
        working-directory: source/evm-contracts
        run: bun run test:docker
        env:
          ETH_RPC_URL: http://localhost:8545
