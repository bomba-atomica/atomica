name: EVM Contracts CI

on:
  workflow_dispatch:
  push:
    branches: [debug-e2e]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install && bun run build

      - name: Check dist folder
        working-directory: source/evm-contracts
        run: ls -la ../../docker-testnet/ethereum-testnet/typescript-sdk/dist/
