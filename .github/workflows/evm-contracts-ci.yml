name: EVM Contracts CI

on:
  workflow_dispatch:
  push:
    branches: [debug-e2e]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/work/atomica/atomica
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build SDK
        run: |
          cd source/docker-testnet/ethereum-testnet/typescript-sdk
          bun install && bun run build
          ls -la dist/

      - name: Check dist from root
        run: ls -la source/docker-testnet/ethereum-testnet/typescript-sdk/dist/
