name: State Proof Verifier

on:
  push:
    branches: [main]
    paths:
      - 'source/state-proofs/typescript/**'
      - 'source/docker-testnet/ethereum-testnet/typescript-sdk/**'
      - '.github/workflows/test-state-proofs.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'source/state-proofs/typescript/**'
      - 'source/docker-testnet/ethereum-testnet/typescript-sdk/**'
      - '.github/workflows/test-state-proofs.yml'
  workflow_dispatch:

# AGENT WARNING: Do not bypass or disable these CI checks. All code changes
# must pass lint with --max-warnings=0, format checks, and all tests.
# CI failures indicate issues that must be fixed before merging.
#
# The test suite runs in two tiers. Only ETH_BACKEND differs.
# - anvil: fast JSON-RPC chain. Runs on draft PRs (feature-correctness).
#   Beacon-only tests self-skip there.
# SCOUT(#237) EDIT: the "Beacon-only tests self-skip" line above is stale once test/beacon is deleted.
# SCOUT(#237) TEST: the two Run Tests steps below run every remaining state-proofs test with bun test; this workflow has path filters and is not in the Required Checks gate.
# SCOUT(#239) TEST: the two Run Tests steps below are the only CI run of verifier.test.ts, mpt.test.ts and integration.test.ts, where the placeholder cases are deleted.
# - docker: full Geth + Lighthouse PoS chain. Runs from ready-for-review
#   onward and on main (system-correctness).

env:
  CI_CLASS: code-hygiene

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # We need to build SDK first because `bun install` in verifier might resolve types/dist
      - name: Install SDK dependencies
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install
      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun run build
      - name: Install Verifier dependencies
        working-directory: source/state-proofs/typescript
        run: bun install
      - name: Run Lint
        working-directory: source/state-proofs/typescript
        # --max-warnings=0 ensures no warnings are allowed (fail on any warning)
        run: bun run lint -- --max-warnings=0

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # We need to build SDK first because `bun install` in verifier might resolve types/dist
      - name: Install SDK dependencies
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install
      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun run build
      - name: Install Verifier dependencies
        working-directory: source/state-proofs/typescript
        run: bun install
      - name: Check Formatting
        working-directory: source/state-proofs/typescript
        run: bun run format:check

  test-anvil:
    name: Verifier tests (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: feature-correctness
      ETH_BACKEND: anvil
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install SDK dependencies
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun run build

      - name: Install Verifier dependencies
        working-directory: source/state-proofs/typescript
        run: bun install

      - name: Build Verifier
        working-directory: source/state-proofs/typescript
        run: bun run build

      - name: Run Tests
        working-directory: source/state-proofs/typescript
        # Runs all tests, including the integration tests that start the Ethereum testnet
        run: bun test
        env:
          # Ensure color output for test results
          FORCE_COLOR: 1

  test-docker:
    name: Verifier tests (docker)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_CLASS: system-correctness
      ETH_BACKEND: docker
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install SDK dependencies
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: bun run build

      - name: Install Verifier dependencies
        working-directory: source/state-proofs/typescript
        run: bun install

      - name: Build Verifier
        working-directory: source/state-proofs/typescript
        run: bun run build

      - name: Run Tests
        working-directory: source/state-proofs/typescript
        # Runs all tests, including the integration tests that start the Ethereum testnet
        run: bun test
        env:
          # Ensure color output for test results
          FORCE_COLOR: 1
