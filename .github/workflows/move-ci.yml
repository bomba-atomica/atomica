name: Test Move Contracts

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**.txt"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "**.txt"]
  workflow_dispatch:

env:
  # The atomica-aptos binary release that CI installs. Its commit must equal the
  # AptosFramework rev in source/atomica-move-contracts/Move.toml (checked below).
  APTOS_VERSION: binary-2c32b09d95

jobs:
  framework-pin:
    name: Check Framework Pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: code-hygiene
    steps:
      - uses: actions/checkout@v4

      - name: Move.toml rev must be the full SHA of APTOS_VERSION
        run: |
          MOVE_TOML=source/atomica-move-contracts/Move.toml
          REV=$(sed -n 's/^AptosFramework = .*rev = "\([^"]*\)".*/\1/p' "$MOVE_TOML")
          APTOS_HASH="${APTOS_VERSION#binary-}"
          echo "Move.toml rev: ${REV:-<none>}"
          echo "APTOS_VERSION: ${APTOS_VERSION}"
          if ! [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=${MOVE_TOML}::AptosFramework rev '${REV}' is not a full 40-character commit SHA"
            exit 1
          fi
          if [[ "$REV" != "$APTOS_HASH"* ]]; then
            echo "::error file=${MOVE_TOML}::AptosFramework rev ${REV} does not match ${APTOS_VERSION}"
            exit 1
          fi
          echo "Move.toml rev matches ${APTOS_VERSION}"

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Aptos CLI
        run: |
          # Download aptos binary from atomica-aptos releases (APTOS_VERSION is set at workflow level)
          # Extract hash from version tag (format: binary-HASH)
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"

          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"

          echo "Installing aptos binary to /usr/local/bin/aptos..."
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos

          echo "Verifying aptos installation..."
          aptos --version
          which aptos

      - name: Run Move Tests
        run: |
          aptos move test --package-dir source/atomica-move-contracts

  lint:
    name: Check Lint Warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: code-hygiene
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Aptos CLI
        run: |
          # Download aptos binary from atomica-aptos releases (APTOS_VERSION is set at workflow level)
          # Extract hash from version tag (format: binary-HASH)
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"

          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"

          echo "Installing aptos binary to /usr/local/bin/aptos..."
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos

          echo "Verifying aptos installation..."
          aptos --version
          which aptos

      - name: Check for Lint Warnings
        run: |
          aptos move compile --package-dir source/atomica-move-contracts --fail-on-warning --named-addresses atomica=0xcafe
