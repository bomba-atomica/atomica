name: Test Web (TypeScript/Vitest)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-aptos-testnet:
    name: Aptos Testnet SDK Tests
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build SDK
        working-directory: source/atomica-sdk
        run: |
          bun install
          bun run build

      - name: Install dependencies
        working-directory: source/docker-testnet/aptos-testnet
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/aptos-testnet
        run: bun run build

      - name: Install Aptos CLI
        run: |
          # Download aptos binary from atomica-aptos releases
          APTOS_VERSION="binary-fac20096d4"
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"

          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"

          echo "Installing aptos binary to /usr/local/bin/aptos..."
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos

          echo "Verifying aptos installation..."
          aptos --version
          which aptos

      - name: Run Aptos Testnet SDK tests
        working-directory: source/docker-testnet/aptos-testnet
        run: bun test

  test-web-demo:
    name: Web Demo Tests (${{ matrix.type }})
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        type: [unit, ui]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Ethereum Testnet SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: |
          bun install
          bun run build

      - name: Build Atomica SDK
        working-directory: source/atomica-sdk
        run: |
          bun install
          bun run build

      - name: Build State Proofs
        working-directory: source/state-proofs/typescript
        run: |
          bun install
          bun run build

      - name: Build Aptos Testnet SDK
        working-directory: source/docker-testnet/aptos-testnet
        run: |
          bun install
          bun run build

      - name: Build Atomica Web UI
        working-directory: source/atomica-web-ui
        run: |
          bun install
          bun run build

      - name: Install demo dependencies
        working-directory: source/atomica-web-demo
        run: bun install

      - name: Install Playwright browsers
        if: matrix.type == 'ui'
        working-directory: source/atomica-web-demo
        run: bunx playwright install --with-deps

      - name: Install Aptos CLI
        if: matrix.type == 'ui'
        run: |
          APTOS_VERSION="binary-fac20096d4"
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"

          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos
          aptos --version

      - name: Run tests
        working-directory: source/atomica-web-demo
        run: |
          if [ "${{ matrix.type }}" = "unit" ]; then
            bun test tests/simple.test.ts tests/sdk-import.test.ts tests/aptos-sdk.test.ts tests/mock-wallet.test.ts tests/app-import.test.ts tests/app-component.test.tsx
          else
            bun test tests/AccountStatus.test.tsx tests/AccountConnection.test.tsx tests/TxButton.skip-submit.test.tsx
          fi

  test-state-proofs:
    name: State Proofs Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Ethereum Testnet SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: |
          bun install
          bun run build

      - name: Build Atomica SDK
        working-directory: source/atomica-sdk
        run: |
          bun install
          bun run build

      - name: Build State Proofs
        working-directory: source/state-proofs/typescript
        run: |
          bun install
          bun run build

      - name: Run IBE tests
        working-directory: source/state-proofs/typescript
        run: bun test tests/ibe.test.ts
