  # ── Gate ───────────────────────────────────────────────────────────────────
  required-checks:
    # The gate. It passes only when every gated job above succeeded. A skipped
    # job counts as a failure, except the docker tier on a draft PR, which
    # skips drafts on purpose, and every job on a docs-only PR, which skips
    # its work on purpose.
    #
    # It needs only `changes`, so its check runs appear as soon as `changes`
    # ends. A `needs:` on the gated jobs would create them only after the
    # slowest job ends (about 30 minutes). Until then an older run's green
    # check would stand on the same head SHA, for example after a base
    # retarget. Instead it polls this run's jobs through the API until every
    # gated job has finished.
    #
    # Fail-closed: a missing or unknown job, an API error, or the poll limit
    # fails it. Docs-only mode needs `changes` to output exactly "false". If
    # `changes` failed, its output is empty, which is != 'false', so every
    # job must succeed.
    #
    # Two matrix legs report the same verdict under two names. Ruleset
    # 11921934 requires "Web Tests (unit)". The job that used that name is now
    # "Aptos Testnet SDK (docker)". Drop that leg once the ruleset requires
    # "Required Checks" instead (issue 173). On a draft PR each name gets a
    # " (draft)" suffix, so a draft run never leaves a green required check
    # on a SHA whose ready-for-review run is still going.
    name: ${{ github.event.pull_request.draft && format('{0} (draft)', matrix.check) || matrix.check }}
    if: ${{ always() }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      CI_CLASS: ignore
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      DRAFT: ${{ github.event.pull_request.draft == true }}
      CODE_CHANGED: ${{ needs.changes.outputs.code != 'false' }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      POLL_SECONDS: "30"
      POLL_LIMIT_MINUTES: "150"
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        check: ["Required Checks", "Web Tests (unit)"]
    steps:
      # SCOUT(#236) EDIT: a new or renamed browser chunk must be added to both Browser Tests lines of the gate list below, or the gate fails on an unknown job.
      - name: Wait for every gated job, fail unless each succeeded
        run: |
          set -euo pipefail
          # Every gated job, as "tier;skipped-name;name...". A matrix job lists
          # each leg's expanded name. When a job-level `if` skips the whole
          # matrix, the API shows one job under the unexpanded skipped-name.
          # The D variable keeps the Actions expression parser off that name.
          # Keep this list in step with the jobs above: an unknown job fails.
          D='$'
          groups=(
            "base;;Test Coverage Guard"
            "base;;Unit Tests (atomica-sdk, atomica-web-components)"
            "base;Web Tests (${D}{{ matrix.type }});Web Tests (integration);Web Tests (meta)"
            "docker;;Aptos Testnet SDK (docker)"
            "base;;Move Framework Pin"
            "base;;Move Unit Tests"
            "base;;Move Lint Warnings"
            "base;Browser Tests (${D}{{ matrix.chunk }}, anvil);Browser Tests (component, anvil);Browser Tests (faucet-wallet, anvil);Browser Tests (auction, anvil);Browser Tests (bid-settle, anvil);Browser Tests (settle-100-bids, anvil);Browser Tests (claim-reclaim, anvil);Browser Tests (happy-path, anvil);Browser Tests (unwind, anvil)"
            "docker;Browser Tests (${D}{{ matrix.chunk }}, docker);Browser Tests (faucet-wallet, docker);Browser Tests (auction, docker);Browser Tests (bid-settle, docker);Browser Tests (settle-100-bids, docker);Browser Tests (claim-reclaim, docker);Browser Tests (happy-path, docker)"
            "base;;EVM e2e tests (anvil)"
            "docker;;EVM e2e tests (docker)"
            "base;;EVM Contract Tests (forge)"
            "docker;;Aptos Light Client Live (docker)"
          )
          # Jobs that are not gated: the classifier and this job's own legs.
          ignored=("Detect docs-only change" "Required Checks" "Web Tests (unit)"
                   "Required Checks (draft)" "Web Tests (unit) (draft)")
          echo "changes = $CHANGES_RESULT, code changed = $CODE_CHANGED, draft = $DRAFT"

          # Reads one job listing ("name<TAB>status<TAB>conclusion" lines) and
          # sets verdict to pass, fail, or wait, with the reasons in report.
          decide() {
            local -A status=() concl=() known=()
            local name st co spec tier skipname leg ok present
            local -a legs
            verdict="pass" report=""
            while IFS=$'\t' read -r name st co; do
              [ -n "$name" ] || continue
              status[$name]=$st concl[$name]=$co
            done <<<"$1"
            for name in "${ignored[@]}"; do known[$name]=1; done
            for spec in "${groups[@]}"; do
              IFS=';' read -r tier skipname _ <<<"$spec"
              ok="success"
              if [ "$CODE_CHANGED" = "false" ]; then
                ok="success skipped"
              elif [ "$DRAFT" = "true" ] && [ "$tier" = "docker" ]; then
                ok="success skipped"
              fi
              IFS=';' read -ra legs <<<"${spec#*;*;}"
              present=0
              if [ -n "$skipname" ]; then
                known[$skipname]=1
                if [ -n "${status[$skipname]+x}" ]; then
                  present=1
                  check_job "$skipname" "$ok"
                fi
              fi
              for leg in "${legs[@]}"; do
                known[$leg]=1
                if [ -n "${status[$leg]+x}" ]; then
                  check_job "$leg" "$ok"
                elif [ "$present" = 0 ]; then
                  note wait "missing: $leg"
                fi
              done
            done
            for name in "${!status[@]}"; do
              [ -n "${known[$name]+x}" ] || note fail "unknown job, not in the gate's list: $name"
            done
          }
          # note LEVEL MSG raises the verdict to LEVEL (pass < wait < fail).
          note() {
            report+="$1: $2"$'\n'
            case "$1:$verdict" in
              fail:*) verdict="fail" ;;
              wait:pass) verdict="wait" ;;
            esac
          }
          check_job() {
            local st=${status[$1]} co=${concl[$1]}
            if [ "$st" != "completed" ]; then
              note wait "$1 is $st"
            elif [[ " $2 " == *" $co "* ]]; then
              report+="ok: $1 = $co"$'\n'
            else
              note fail "$1 = ${co:-none} (want: $2)"
            fi
          }

          deadline=$((SECONDS + POLL_LIMIT_MINUTES * 60))
          errors=0
          missing_polls=0
          while :; do
            if listing=$(gh api --paginate \
                "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100&filter=latest" \
                --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv'); then
              errors=0
              decide "$listing"
              if [ "$verdict" = wait ] && ! grep -q '^wait: .* is ' <<<"$report"; then
                # Only missing jobs remain. Gated jobs start with this job, so
                # one still missing after a few polls never existed.
                missing_polls=$((missing_polls + 1))
                [ "$missing_polls" -lt 4 ] || verdict="fail"
              else
                missing_polls=0
              fi
              if [ "$verdict" != wait ]; then
                printf '%s' "$report"
                [ "$verdict" = pass ] && { echo "All gated jobs passed."; exit 0; }
                echo "::error::the gate failed, see the lines above"
                exit 1
              fi
            else
              errors=$((errors + 1))
              echo "::warning::job listing failed ($errors in a row)"
              [ "$errors" -lt 5 ] || { echo "::error::job listing kept failing"; exit 1; }
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s' "$report"
              echo "::error::gated jobs still unfinished after $POLL_LIMIT_MINUTES minutes"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
