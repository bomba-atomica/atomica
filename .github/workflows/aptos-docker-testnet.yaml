name: Aptos Docker Testnet Tests

on:
  push:
    branches: [main]
    paths:
      - "source/docker-testnet/typescript-sdk/**"
      - "source/docker-testnet/aptos-testnet/**"
      - "source/docker-testnet/config/**"
      - ".github/workflows/aptos-docker-testnet.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "source/docker-testnet/typescript-sdk/**"
      - "source/docker-testnet/aptos-testnet/**"
      - "source/docker-testnet/config/**"
      - ".github/workflows/aptos-docker-testnet.yaml"
  workflow_dispatch:

# Integration tests against the Aptos Docker testnet: ready-for-review onward.
env:
  CI_CLASS: system-correctness

jobs:
  test:
    name: Aptos Docker Testnet Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      packages: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Aptos CLI
        run: |
          # Download aptos binary from atomica-aptos releases
          APTOS_VERSION="binary-2c32b09d95"
          # Extract hash from version tag (format: binary-HASH)
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"

          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"

          echo "Installing aptos binary to /usr/local/bin/aptos..."
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos

          echo "Verifying aptos installation..."
          aptos --version
          which aptos

      - name: Install SDK dependencies
        working-directory: source/docker-testnet/typescript-sdk
        run: bun install

      - name: Build SDK
        working-directory: source/docker-testnet/typescript-sdk
        run: bun run build

      - name: Run validator connectivity tests
        working-directory: source/docker-testnet/typescript-sdk
        run: bun --env-file=../../.env.test test test/validator-connectivity.test.ts
        timeout-minutes: 10

      - name: Run faucet tests
        working-directory: source/docker-testnet/typescript-sdk
        run: bun --env-file=../../.env.test test test/faucet.test.ts
        timeout-minutes: 10

      - name: Run block production tests
        working-directory: source/docker-testnet/typescript-sdk
        run: bun --env-file=../../.env.test test test/block-production.test.ts
        timeout-minutes: 10

      - name: Run validator sync tests
        working-directory: source/docker-testnet/typescript-sdk
        run: bun --env-file=../../.env.test test test/validator-sync.test.ts
        timeout-minutes: 10

      # 4 validators, timelock DKG on at genesis: after epoch 2, ibe_config is_ready
      # and get_mpk is 96 bytes.
      - name: Run timelock genesis tests
        working-directory: source/docker-testnet/typescript-sdk
        run: bun --env-file=../../.env.test test test/timelock-genesis.test.ts
        timeout-minutes: 10

      - name: Cleanup Docker on failure
        if: failure()
        working-directory: source/docker-testnet/config
        run: docker compose down -v --remove-orphans || true

      - name: Show Docker logs on failure
        if: failure()
        working-directory: source/docker-testnet/config
        run: |
          echo "=== Validator logs ==="
          docker compose logs validator --tail=50 || true
