name: Lint Web

on:
  pull_request:
    
    paths:
      - 'source/atomica-web/**'
      - '.github/workflows/lint-web.yaml'
  push:
    
    paths:
      - 'source/atomica-web/**'
      - '.github/workflows/lint-web.yaml'
  workflow_dispatch:

jobs:
  eslint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd source/atomica-web
          bun install

      - name: Run ESLint
        run: |
          cd source/atomica-web
          bun run lint

  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd source/atomica-web
          bun install

      - name: Check Prettier formatting
        run: |
          cd source/atomica-web
          bun run format:check

  typescript:
    name: TypeScript Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd source/atomica-web
          bun install

      - name: Check TypeScript compilation
        run: |
          cd source/atomica-web
          bun x tsc --noEmit
