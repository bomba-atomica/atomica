name: Test Web UI (Browser Integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  test-web:
    name: atomica-web-ui browser integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Aptos CLI
        run: |
          APTOS_VERSION="binary-125d36b957"
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"
          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos
          aptos --version

      - name: Install Playwright browsers
        run: |
          cd source/atomica-web-ui
          bun install
          bunx playwright install chromium --with-deps

      - name: Build SDK dependencies
        run: |
          cd source/atomica-sdk
          bun install && bun run build
          cd ../docker-testnet/aptos-testnet
          bun install && bun run build
          cd ../../state-proofs/typescript
          bun install && bun run build

      - name: Install web-ui dependencies
        working-directory: source/atomica-web-ui
        run: bun install

      - name: Build EVM contracts
        working-directory: source/evm-contracts
        run: |
          forge install
          bun install

      - name: Run browser integration tests
        working-directory: source/atomica-web-ui
        run: bun run test
        env:
          CI: true
        timeout-minutes: 30
