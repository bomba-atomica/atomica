name: Test Web UI (Browser Integration)

# The happy-path browser test runs in two tiers. Only ETH_BACKEND differs.
# - anvil: fast JSON-RPC Ethereum chain. Runs on draft PRs (feature-correctness).
# - docker: full Geth + Lighthouse PoS chain. Runs from ready-for-review
#   onward and on main (system-correctness).
# Both tiers start the Aptos Docker testnet, so both log in to GHCR.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**.txt"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "**.txt"]
  workflow_dispatch:

jobs:
  test-web-anvil:
    name: atomica-web-components happy-path (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_CLASS: feature-correctness
      ETH_BACKEND: anvil
    permissions:
      packages: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Aptos CLI
        run: |
          APTOS_VERSION="binary-e41b69f662"
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"
          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos
          aptos --version

      - name: Build Ethereum Testnet SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: |
          bun install
          bun run build

      - name: Build State Proofs
        working-directory: source/state-proofs/typescript
        run: |
          bun install
          bun run build

      - name: Build Atomica SDK
        working-directory: source/atomica-sdk
        run: |
          bun install
          bun run build

      - name: Build Aptos Testnet SDK
        working-directory: source/docker-testnet/aptos-testnet
        run: |
          bun install
          bun run build

      - name: Build EVM contracts
        working-directory: source/evm-contracts
        run: |
          forge install
          forge build

      - name: Install Web UI dependencies
        working-directory: source/atomica-web-components
        run: bun install

      - name: Build Atomica Web UI
        working-directory: source/atomica-web-components
        run: bun run build

      - name: Install Playwright browsers
        working-directory: source/atomica-web-components
        run: bunx playwright install --with-deps chromium

      - name: Run happy-path browser integration test
        working-directory: source/atomica-web-components
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bunx vitest run tests/integration/14-happy-path.test.tsx
        timeout-minutes: 25

  test-web-docker:
    name: atomica-web-components happy-path (docker)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_CLASS: system-correctness
      ETH_BACKEND: docker
    permissions:
      packages: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Aptos CLI
        run: |
          APTOS_VERSION="binary-e41b69f662"
          APTOS_HASH="${APTOS_VERSION#binary-}"
          APTOS_BINARY_NAME="aptos-${APTOS_HASH}"
          APTOS_URL="https://github.com/bomba-atomica/atomica-aptos/releases/download/${APTOS_VERSION}/${APTOS_BINARY_NAME}"
          echo "Downloading aptos binary from ${APTOS_URL}..."
          curl -L -o /tmp/aptos "${APTOS_URL}"
          chmod +x /tmp/aptos
          sudo mv /tmp/aptos /usr/local/bin/aptos
          aptos --version

      - name: Build Ethereum Testnet SDK
        working-directory: source/docker-testnet/ethereum-testnet/typescript-sdk
        run: |
          bun install
          bun run build

      - name: Build State Proofs
        working-directory: source/state-proofs/typescript
        run: |
          bun install
          bun run build

      - name: Build Atomica SDK
        working-directory: source/atomica-sdk
        run: |
          bun install
          bun run build

      - name: Build Aptos Testnet SDK
        working-directory: source/docker-testnet/aptos-testnet
        run: |
          bun install
          bun run build

      - name: Build EVM contracts
        working-directory: source/evm-contracts
        run: |
          forge install
          forge build

      - name: Install Web UI dependencies
        working-directory: source/atomica-web-components
        run: bun install

      - name: Build Atomica Web UI
        working-directory: source/atomica-web-components
        run: bun run build

      - name: Install Playwright browsers
        working-directory: source/atomica-web-components
        run: bunx playwright install --with-deps chromium

      - name: Run happy-path browser integration test
        working-directory: source/atomica-web-components
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: bunx vitest run tests/integration/14-happy-path.test.tsx
        timeout-minutes: 25
